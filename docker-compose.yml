services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shortner_url
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d shortner_url"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      # 1. Persistência dos dados (impede perda ao desligar o container)
      - postgres_data:/var/lib/postgresql/data
      
      # 2. Executa scripts SQL automaticamente APENAS na primeira vez que o volume for criado
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  postgres_data: